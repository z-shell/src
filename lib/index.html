<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z-Shell / src — CDN Assets</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --text-muted: #8b949e;
        --primary: #58a6ff;
        --accent: #bc8cff;
        --terminal-header: #21262d;
        --font-mono: "Fira Code", "JetBrains Mono", "Consolas", monospace;
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        padding: 20px;
        line-height: 1.5;
      }

      .container {
        width: 100%;
        max-width: 800px;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
      }

      .header img {
        width: 80px;
        height: 80px;
        margin-bottom: 16px;
        filter: drop-shadow(0 0 10px rgba(88, 166, 255, 0.3));
      }

      .header h1 {
        font-size: 24px;
        margin: 0;
        letter-spacing: -0.5px;
        font-weight: 600;
      }

      .header p {
        color: var(--text-muted);
        margin: 8px 0 0;
      }

      .terminal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      .terminal-header {
        background: var(--terminal-header);
        padding: 10px 16px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .dot-red {
        background: #ff5f56;
      }
      .dot-yellow {
        background: #ffbd2e;
      }
      .dot-green {
        background: #27c93f;
      }

      .terminal-title {
        flex-grow: 1;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--text-muted);
        margin-right: 42px; /* balance dots */
      }

      .terminal-content {
        padding: 24px;
        font-family: var(--font-mono);
        font-size: 14px;
      }

      .prompt {
        color: var(--accent);
        margin-right: 8px;
      }
      .command {
        color: var(--primary);
      }

      .asset-list {
        margin-top: 24px;
        list-style: none;
        padding: 0;
      }

      .asset-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 12px;
        background: rgba(48, 54, 61, 0.2);
        transition: border-color 0.2s;
      }

      .asset-item:hover {
        border-color: var(--primary);
      }

      .asset-info {
        display: flex;
        flex-direction: column;
      }

      .asset-name {
        font-weight: bold;
        color: var(--primary);
      }

      .asset-url {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      .btn-copy {
        background: var(--terminal-header);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 12px;
        transition: all 0.2s;
      }

      .btn-copy:hover {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
      }

      .footer {
        margin-top: 40px;
        text-align: center;
        font-size: 14px;
        color: var(--text-muted);
      }

      .footer a {
        color: var(--primary);
        text-decoration: none;
        margin: 0 10px;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 600px) {
        .asset-item {
          flex-direction: column;
          align-items: flex-start;
        }
        .btn-copy {
          margin-top: 12px;
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img
          src="https://raw.githubusercontent.com/z-shell/.github/main/profile/img/logo.png"
          alt="Z-Shell Logo"
        />
        <h1>Z-Shell / src</h1>
        <p>High-performance CDN for Z-Shell ecosystem assets.</p>
      </div>

      <div class="terminal">
        <div class="terminal-header">
          <div class="dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
          </div>
          <div class="terminal-title">z-shell@src:~</div>
        </div>
        <div class="terminal-content">
          <div>
            <span class="prompt">❯</span>
            <span class="command">ls -1 assets/</span>
          </div>
          <ul class="asset-list">
            <li class="asset-item">
              <div class="asset-info">
                <span class="asset-name">Zi Loader</span>
                <span class="asset-url">src.zshell.dev/zsh/init.zsh</span>
              </div>
              <button
                class="btn-copy"
                onclick="copyToClipboard('https://src.zshell.dev/zsh/init.zsh')"
              >
                COPY URL
              </button>
            </li>
            <li class="asset-item">
              <div class="asset-info">
                <span class="asset-name">Zi Installer</span>
                <span class="asset-url">get.zshell.dev</span>
              </div>
              <button
                class="btn-copy"
                onclick="
                  copyToClipboard(
                    'sh -c &quot;$(curl -fsSL https://get.zshell.dev)&quot;',
                  )
                "
              >
                COPY INSTALL CMD
              </button>
            </li>
            <li class="asset-item">
              <div class="asset-info">
                <span class="asset-name">Zi Wiki</span>
                <span class="asset-url">wiki.zshell.dev</span>
              </div>
              <button
                class="btn-copy"
                onclick="copyToClipboard('https://wiki.zshell.dev')"
              >
                VISIT WIKI
              </button>
            </li>
          </ul>
          <div style="margin-top: 16px">
            <span class="prompt">❯</span> <span class="blink">_</span>
          </div>
        </div>
      </div>

      <div class="footer">
        <a href="https://github.com/z-shell/src">GitHub</a>
        <a href="https://wiki.zshell.dev">Wiki</a>
        <a href="https://github.com/orgs/z-shell/discussions">Discussions</a>
      </div>
    </div>

    <script>
      function copyToClipboard(text) {
        if (text.startsWith("https://wiki.zshell.dev")) {
          window.open(text, "_blank");
          return;
        }
        navigator.clipboard.writeText(text).then(() => {
          const btn = event.target;
          const originalText = btn.innerText;
          btn.innerText = "COPIED!";
          btn.style.background = "#238636";
          btn.style.borderColor = "#2ea043";
          setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "";
            btn.style.borderColor = "";
          }, 2000);
        });
      }
    </script>

    <style>
      @keyframes blink {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .blink {
        animation: blink 1s step-end infinite;
        color: var(--primary);
        font-weight: bold;
      }
    </style>
  </body>
</html>
