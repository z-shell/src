---
name: Windows Install

on:
  pull_request:
    paths:
      - "public/setup/**"
      - "public/sh/**"
      - "public/zsh/**"
      - "tests/**"
      - ".github/workflows/win-install.yml"
  push:
    paths:
      - "public/setup/**"
      - "public/sh/**"
      - "public/zsh/**"
      - "tests/**"
      - ".github/workflows/win-install.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ☑️ ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "./public/sh"
  run-install:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [shellcheck]
    steps:
      - name: 🪟 Set CRLF (Windows)
        run: |
          git config --global core.autocrlf input
          git config --global --add safe.directory /cygdrive/d/a/src/src
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🪟 Dependencies (Windows)
        uses: egor-tensin/setup-cygwin@fca9069f92361187d4abfaa5d8a7490e435d8349 # v4.0.2
        with:
          packages: curl git zsh
      - name: 🪟 Run Install
        run: |
          set -eu
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          command rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/zi" ~/.zi ~/.zshrc "${XDG_CONFIG_HOME:-$HOME/.config}/zi"
          sh ./tests/installers.sh
          sh -x ./public/sh/install.sh -i skip
          test -f "${XDG_DATA_HOME:-$HOME/.local/share}/zi/bin/zi.zsh"
          test ! -e ~/.zshrc
          command rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/zi" ~/.zi ~/.zshrc "${XDG_CONFIG_HOME:-$HOME/.config}/zi"
          sh -x ./public/sh/install.sh -a annex
          grep -Fq "z-shell/z-a-meta-plugins" "${XDG_CONFIG_HOME:-$HOME/.config}/zi/setup/shell.zsh"
          command rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/zi" ~/.zi ~/.zshrc "${XDG_CONFIG_HOME:-$HOME/.config}/zi"
          sh -x ./public/sh/install.sh -a loader
          grep -Fq "source '${XDG_CONFIG_HOME:-$HOME/.config}/zi/setup.zsh'" ~/.zshrc
          grep -Fq "zzinit" "${XDG_CONFIG_HOME:-$HOME/.config}/zi/setup.zsh"
          command rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/zi" ~/.zi ~/.zshrc "${XDG_CONFIG_HOME:-$HOME/.config}/zi"
          sh -x ./public/sh/install.sh -a zunit
          grep -Fq "@zunit" "${XDG_CONFIG_HOME:-$HOME/.config}/zi/setup/shell.zsh"
          command rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/zi" ~/.zi ~/.zshrc "${XDG_CONFIG_HOME:-$HOME/.config}/zi"
          sh -x ./public/sh/install.sh -a zpmod
        shell: C:\tools\cygwin\bin\bash.exe --login -o igncr '{0}'
      - name: 🪟 Smoke-test — verify zi.zsh present
        run: |
          ZI_BIN="${XDG_DATA_HOME:-${HOME}/.local/share}/zi/bin"
          if [ ! -f "${ZI_BIN}/zi.zsh" ]; then
            printf '%s\n' "FAIL: zi.zsh not found at ${ZI_BIN}/zi.zsh"
            exit 1
          fi
          printf '%s\n' "OK: zi.zsh found at ${ZI_BIN}/zi.zsh"
          command rm -rf "${XDG_DATA_HOME:-${HOME}/.local/share}/zi" /home/runneradmin/.zi
        shell: C:\tools\cygwin\bin\bash.exe --login -o igncr '{0}'
