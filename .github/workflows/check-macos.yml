---
name: Check (macOS)

on:
  push:
    branches: [main]
    paths:
      - "public/sh/**"
      - "public/zsh/**"
      - "tests/**"
      - ".github/workflows/check-macos.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: macOS ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ☑️ ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "./public/sh"

  build:
    name: macOS Installer and Loader
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [shellcheck]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️  Prepare dependencies
        run: |
          brew install autoconf zsh
      - name: "⚙️ Generate checksums"
        run: sh ./public/sh/generate-checksums.sh
      - name: "⚙️ Check: unit fixtures"
        run: sh ./tests/installers.sh
      - name: "⚙️ Check: install.sh -i skip"
        run: |
          set -eu
          # Start from a clean home; later steps clean up after themselves.
          command rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/zi" ~/.zi ~/.zshrc "${XDG_CONFIG_HOME:-$HOME/.config}/zi"
          sh -x ./public/sh/install.sh -i skip
          test -f "${XDG_DATA_HOME:-$HOME/.local/share}/zi/bin/zi.zsh"
          if grep -qs "zi.zsh" ~/.zshrc; then echo "-i skip modified .zshrc"; exit 1; fi
          command rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/zi" ~/.zi ~/.zshrc "${XDG_CONFIG_HOME:-$HOME/.config}/zi"
      - name: "⚙️ Check: install.sh -a annex"
        run: |
          set -eu
          sh -x ./public/sh/install.sh -a annex
          test -f "${XDG_DATA_HOME:-$HOME/.local/share}/zi/bin/zi.zsh"
          grep -q "z-shell/z-a-meta-plugins" ~/.zshrc
          command rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/zi" ~/.zi ~/.zshrc "${XDG_CONFIG_HOME:-$HOME/.config}/zi"
      - name: "⚙️ Check: install.sh -a loader"
        run: |
          set -eu
          sh -x ./public/sh/install.sh -a loader
          test -f "${XDG_DATA_HOME:-$HOME/.local/share}/zi/bin/zi.zsh"
          test -f "${XDG_CONFIG_HOME:-$HOME/.config}/zi/init.zsh"
          grep -q "zzinit" ~/.zshrc
          command rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/zi" ~/.zi ~/.zshrc "${XDG_CONFIG_HOME:-$HOME/.config}/zi"
      - name: "⚙️ Check: install.sh -a zunit"
        run: |
          set -eu
          sh -x ./public/sh/install.sh -a zunit
          test -f "${XDG_DATA_HOME:-$HOME/.local/share}/zi/bin/zi.zsh"
          grep -q "@zunit" ~/.zshrc
          command rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/zi" ~/.zi ~/.zshrc "${XDG_CONFIG_HOME:-$HOME/.config}/zi"
      - name: "⚙️ Check: install_zpmod.sh"
        run: sh -x ./public/sh/install_zpmod.sh
      - name: ⚙️ Load zpmod module
        run: |
          module_path+=( "${XDG_DATA_HOME:-$HOME/.local/share}/zi/zmodules/zpmod/Src" )
          zmodload zi/zpmod
          zpmod source-study -l
        shell: zsh {0}
