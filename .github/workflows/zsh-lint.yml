---
name: Zsh Lint

on:
  push:
    branches: [next, main]
    paths:
      - "public/zsh/init.zsh"
      - ".github/workflows/zsh-lint.yml"
  pull_request:
    branches: [next, main]
    paths:
      - "public/zsh/init.zsh"
      - ".github/workflows/zsh-lint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh-lint:
    name: Zsh Lint
    uses: z-shell/.github/.github/workflows/zsh-lint.yml@e9cad163297f84eb2c315ac36da82877f0504a01
    with:
      zsh-lint-ref: 3c4966b454fc07a346772a24d8311adab91414ed
      paths: |
        public/zsh/init.zsh
